name: Build

on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  build:
    name: ${{ matrix.name }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: Linux
            os: ubuntu-latest
          - name: macOS
            os: macos-latest
          - name: Windows
            os: windows-latest

    steps:
      - uses: actions/checkout@v4

      - name: Install Linux dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            libgl1-mesa-dev libx11-dev libxrandr-dev libxinerama-dev \
            libxcursor-dev libxi-dev libxkbcommon-dev libwayland-dev \
            wayland-protocols extra-cmake-modules pkg-config

      - name: Configure
        run: cmake -B build -DCMAKE_BUILD_TYPE=Release

      - name: Build
        run: cmake --build build --config Release --parallel

      - name: Check runtime linkage
        shell: bash
        run: |
          case "$RUNNER_OS" in
            Linux)
              ldd build/gfx_node_editor
              if ldd build/gfx_node_editor | grep -E 'libstdc\+\+|libgcc_s'; then
                echo "::error::C++ runtime is linked dynamically"; exit 1
              fi ;;
            macOS)
              otool -L build/gfx_node_editor ;;
            Windows)
              exe=build/Release/gfx_node_editor.exe
              deps=$(dumpbin.exe //dependents "$exe" 2>/dev/null || true)
              if [ -z "$deps" ]; then
                vswhere="/c/Program Files (x86)/Microsoft Visual Studio/Installer/vswhere.exe"
                vs=$("$vswhere" -latest -property installationPath)
                dumpbin=$(find "$vs/VC/Tools/MSVC" -path '*Hostx64/x64/dumpbin.exe' | head -n1)
                deps=$("$dumpbin" //dependents "$exe")
              fi
              echo "$deps"
              if echo "$deps" | grep -iE 'msvcp|vcruntime|ucrtbase|api-ms-win-crt'; then
                echo "::error::C++ runtime is linked dynamically"; exit 1
              fi ;;
          esac

      - name: Package
        shell: bash
        run: |
          mkdir -p dist
          if [ "$RUNNER_OS" = "Windows" ]; then
            cp build/Release/gfx_node_editor.exe dist/
            cp -r build/Release/fonts dist/
          else
            cp build/gfx_node_editor dist/
            cp -r build/fonts dist/
          fi

      - uses: actions/upload-artifact@v4
        with:
          name: gfx_node_editor-${{ runner.os }}
          path: dist/
