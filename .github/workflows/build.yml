name: Build

on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  build:
    name: ${{ matrix.name }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: Linux
            os: ubuntu-latest
          - name: macOS
            os: macos-latest
          - name: Windows
            os: windows-latest

    steps:
      - uses: actions/checkout@v4

      - name: Install Linux dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            libgl1-mesa-dev libx11-dev libxrandr-dev libxinerama-dev \
            libxcursor-dev libxi-dev libxkbcommon-dev libwayland-dev \
            wayland-protocols extra-cmake-modules pkg-config

      - name: Configure
        run: cmake -B build -DCMAKE_BUILD_TYPE=Release

      - name: Build
        run: cmake --build build --config Release --parallel

      - name: Check runtime linkage
        shell: bash
        run: |
          case "$RUNNER_OS" in
            Linux)
              ldd build/gfx_node_editor
              if ldd build/gfx_node_editor | grep -E 'libstdc\+\+|libgcc_s'; then
                echo "::error::C++ runtime is linked dynamically"; exit 1
              fi ;;
            macOS)
              otool -L build/gfx_node_editor ;;
            Windows)
              exe=build/Release/gfx_node_editor.exe
              deps=$(dumpbin.exe //dependents "$exe" 2>/dev/null || true)
              if [ -z "$deps" ]; then
                vswhere="/c/Program Files (x86)/Microsoft Visual Studio/Installer/vswhere.exe"
                vs=$("$vswhere" -latest -property installationPath)
                dumpbin=$(find "$vs/VC/Tools/MSVC" -path '*Hostx64/x64/dumpbin.exe' | head -n1)
                deps=$("$dumpbin" //dependents "$exe")
              fi
              echo "$deps"
              if echo "$deps" | grep -iE 'msvcp|vcruntime|ucrtbase|api-ms-win-crt'; then
                echo "::error::C++ runtime is linked dynamically"; exit 1
              fi ;;
          esac

      - name: Package
        shell: bash
        run: |
          mkdir -p dist
          if [ "$RUNNER_OS" = "Windows" ]; then
            cp build/Release/gfx_node_editor.exe dist/
            cp -r build/Release/fonts dist/
          else
            cp build/gfx_node_editor dist/
            cp -r build/fonts dist/
          fi

      - uses: actions/upload-artifact@v4
        with:
          name: gfx_node_editor-${{ runner.os }}
          path: dist/

  # Publishes a GitHub release once all three builds have succeeded.
  #   - Push to the default branch: a new release tagged build-<run number>.
  #   - Push of a tag starting with "v" (e.g. v1.1): a release for that tag.
  # Pull requests and other branches only build; they never release.
  release:
    name: Release
    needs: build
    if: >-
      github.event_name == 'push' &&
      (github.ref == format('refs/heads/{0}', github.event.repository.default_branch) ||
       startsWith(github.ref, 'refs/tags/v'))
    runs-on: ubuntu-latest
    permissions:
      contents: write   # create tags and releases with GITHUB_TOKEN
    concurrency:
      group: release
      cancel-in-progress: false

    steps:
      - uses: actions/download-artifact@v4
        with:
          path: artifacts   # one folder per artifact: artifacts/gfx_node_editor-<OS>/

      - name: Create archives
        shell: bash
        run: |
          mkdir -p release
          cd artifacts
          for dir in gfx_node_editor-*; do
            os=${dir#gfx_node_editor-}
            if [ "$os" = "Windows" ]; then
              (cd "$dir" && zip -r -q "../../release/$dir.zip" .)
            else
              # Artifacts lose the executable bit on upload, so restore it before archiving.
              chmod +x "$dir/gfx_node_editor"
              tar -czf "../release/$dir.tar.gz" -C "$dir" .
            fi
          done
          ls -l ../release

      - name: Publish release
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          COMMIT_MSG: ${{ github.event.head_commit.message }}
        run: |
          if [[ "$GITHUB_REF" == refs/tags/* ]]; then
            # A version tag: name the release after it and let GitHub write the notes.
            gh release create "$GITHUB_REF_NAME" release/* \
              --title "$GITHUB_REF_NAME" \
              --generate-notes
          else
            tag="build-${GITHUB_RUN_NUMBER}"
            short_sha="${GITHUB_SHA::7}"
            {
              echo "Automatic build of commit ${short_sha} on ${GITHUB_REF_NAME}."
              echo
              echo '```'
              echo "$COMMIT_MSG"
              echo '```'
            } > notes.md
            gh release create "$tag" release/* \
              --target "$GITHUB_SHA" \
              --title "Build ${GITHUB_RUN_NUMBER} (${short_sha})" \
              --notes-file notes.md
          fi
